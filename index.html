<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="background">
        <div class="timer">
            <p id="hours">00</p>:
            <p id="minutes">00</p>:
            <p id="seconds">00</p>
        </div>

        <div class="controls">
            <button id="start" onclick="startTimer()">Iniciar</button>
            <button id="stop" onclick="stopTimer()" disabled>Parar</button>
            <button id="reset" onclick="resetTimer()" disabled>Reiniciar</button>
        </div>
    </main>
</body>
<script src="script.js"></script>

</html>
